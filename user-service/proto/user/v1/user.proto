syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "library_app/user-service/gen/go/user/v1;userv1";

// Metadata of the Swagger UI served by the HTTP interface of the service.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "User Service API"
    version: "1.0"
    description: "Accounts of readers and librarians, authentication and sessions. REST endpoints are proxied to user.v1.UserService over gRPC. Every method except Register, Login and AuthenticateToken expects the header 'authorization: Bearer <token>' with the token returned by Login."
    contact: {name: "library_app"}
  }
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        description: "Session token returned by Login, sent as 'Bearer <token>'."
        name: "authorization"
        in: IN_HEADER
      }
    }
  }
};

// Role of a user, ordered by growing privileges.
enum Role {
  ROLE_UNSPECIFIED = 0;

  // Reader: borrows books, manages only own account.
  ROLE_READER = 1;

  // Librarian: manages the catalog and the accounts of readers.
  ROLE_LIBRARIAN = 2;
}

// Lifecycle state of an account.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;

  // The account may sign in.
  USER_STATUS_ACTIVE = 1;

  // Blocked by a librarian: signing in is refused, the data is kept.
  USER_STATUS_DEACTIVATED = 2;
}

// Account of a reader or a librarian. A password is never returned.
message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  Role role = 4;
  UserStatus status = 5;
  string phone = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;

  // Last successful sign in, absent while the account never signed in.
  google.protobuf.Timestamp last_login_at = 9;
}

// Session opened by Login. The token is returned once and stored as a hash.
message Session {
  string id = 1;
  string user_id = 2;

  // Bearer token, send it as 'authorization: Bearer <token>'.
  string access_token = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// Identity of the caller resolved from a bearer token.
message Principal {
  string user_id = 1;
  string email = 2;
  Role role = 3;
  string session_id = 4;
  google.protobuf.Timestamp session_expires_at = 5;
}

// Self service registration, the role is always ROLE_READER.
message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
}

// Account created by a librarian, the role is chosen explicitly.
message CreateUserRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
  Role role = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateTokenRequest {
  string token = 1;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  // Free text filter matched against full name, email and phone.
  string query = 1;

  // Restrict the answer to one role, UNSPECIFIED means every role.
  Role role = 2;

  // Restrict the answer to one status, UNSPECIFIED means every status.
  UserStatus status = 3;

  // Page size, 0 means the service default (20), capped at 100.
  int32 limit = 4;

  // Number of entries to skip.
  int32 offset = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// Only the fields present in the request are updated. A reader may change own
// full name and phone; changing the email, the role or the status needs a
// librarian.
message UpdateUserRequest {
  string id = 1;
  optional string full_name = 2;
  optional string phone = 3;
  optional string email = 4;
  optional Role role = 5;
  optional UserStatus status = 6;
}

// Replaces the password of an account. The owner has to prove the current
// password, a librarian may set a new one without it.
message ChangePasswordRequest {
  string id = 1;
  string current_password = 2;
  string new_password = 3;
}

message DeactivateUserRequest {
  string id = 1;
}

message RestoreUserRequest {
  string id = 1;
}

// Accounts of readers and librarians, authentication and sessions.
//
// Every RPC except AuthenticateToken is also exposed as a REST endpoint
// through grpc-gateway, which is what the Swagger UI at /swagger/ exercises.
// The methods annotated with BearerAuth refuse a request without a valid
// token with UNAUTHENTICATED, and a request whose role check fails with
// PERMISSION_DENIED.
service UserService {
  // Registers a reader. Public method: e-mail must be valid and unused.
  rpc Register(RegisterRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Exchanges credentials for a bearer token. Public method: wrong or
  // deactivated credentials are answered with UNAUTHENTICATED.
  rpc Login(LoginRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // Revokes the session the request is authenticated with.
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/v1/auth/logout"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Returns the account of the caller.
  rpc GetCurrentUser(google.protobuf.Empty) returns (User) {
    option (google.api.http) = {get: "/v1/auth/me"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Resolves a bearer token into an identity. Internal gRPC method for the API
  // gateway and the other services, deliberately without a REST route.
  rpc AuthenticateToken(AuthenticateTokenRequest) returns (Principal);

  // Creates an account of any role. Librarian only.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Returns one account: own account for a reader, any account for a
  // librarian.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/users/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Returns a page of accounts. Librarian only.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/users"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Applies a partial update of an account.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/users/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Replaces a password and revokes every other session of the account.
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/users/{id}/password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Blocks an account and revokes all of its sessions. Librarian only.
  rpc DeactivateUser(DeactivateUserRequest) returns (User) {
    option (google.api.http) = {post: "/v1/users/{id}/deactivate"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }

  // Unblocks an account. Librarian only.
  rpc RestoreUser(RestoreUserRequest) returns (User) {
    option (google.api.http) = {post: "/v1/users/{id}/restore"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {security_requirement: {key: "BearerAuth"}}
    };
  }
}
