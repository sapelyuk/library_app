name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Module download cache (pkg/mod) and build cache (GOCACHE).
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Build pkg
        run: go build ./...
        working-directory: pkg

      - name: Build book-service
        run: go build ./...
        working-directory: services/book-service

      - name: Build user-service
        run: go build ./...
        working-directory: services/user-service

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Test book-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/book-service

      - name: Coverage report (book-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/book-service

      - name: Test user-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/user-service

      - name: Coverage report (user-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/user-service
