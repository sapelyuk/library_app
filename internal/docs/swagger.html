<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Service — API reference</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="openapi"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script type="application/yaml" id="openapi-spec">
/*__OPENAPI_SPEC__*/
    </script>
    <script>
      SwaggerUIBundle({
        spec: window.yaml ? window.yaml.load(document.getElementById("openapi-spec").textContent) : undefined,
        dom_id: "#openapi",
        deepLinking: true,
        tryItOutEnabled: true,
      });
    </script>
    <script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
  </body>
</html>
