openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: >-
    Accounts, roles and sessions of the library platform. The service is gRPC
    first; the operations below are the REST mappings the gateway exposes.
    Timestamps are Unix seconds, passwords and refresh tokens are never
    returned.
servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: Sessions
  - name: Readers
  - name: Staff
paths:
  /v1/session:
    post:
      tags: [Sessions]
      summary: Exchange credentials for a token pair
      operationId: Login
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Token pair issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Sessions]
      summary: Revoke the session of the access token
      operationId: Logout
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "204": { description: Session revoked. }
        default: { $ref: "#/components/responses/Error" }
  /v1/session/refresh:
    post:
      tags: [Sessions]
      summary: Rotate a refresh token
      description: Reuse of an already rotated token revokes the whole family.
      operationId: RefreshSession
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }
  /v1/readers:
    post:
      tags: [Readers]
      summary: Register a reader
      operationId: RegisterReader
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReaderInput" }
      responses:
        "201":
          description: Reader created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
  /v1/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Readers, Staff]
      summary: Read one account
      description: A reader sees only its own record, a librarian sees any.
      operationId: GetAccount
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Staff]
      summary: Deactivate an account
      operationId: DeactivateAccount
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "204": { description: Account deactivated. }
        default: { $ref: "#/components/responses/Error" }
  /v1/readers/{id}/password:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [Readers]
      summary: Change the password with the current one
      operationId: ChangePassword
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "204": { description: Password changed, sessions revoked. }
        default: { $ref: "#/components/responses/Error" }
  /v1/staff/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [Staff]
      summary: Issue a one time password for a librarian
      operationId: ResetLibrarianPassword
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "201":
          description: One time password, returned once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporary_password: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/staff:
    get:
      tags: [Staff]
      summary: List librarians
      operationId: ListLibrarians
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      responses:
        "200":
          description: Librarians.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Staff]
      summary: Create a librarian
      operationId: CreateLibrarian
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibrarianInput" }
      responses:
        "201":
          description: Librarian created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
  /v1/staff/{id}/role:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [Staff]
      summary: Assign a role
      operationId: AssignRole
      security:
        - ApiKeyAuth: []
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Account with the new role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Service key issued to a trusted caller such as the gateway.
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by Login, carries the caller identity.
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Role:
      type: string
      enum: [READER, LIBRARIAN, ADMIN]
    Error:
      type: object
      properties:
        code:
          type: string
          description: gRPC status name, for example InvalidArgument.
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        login: { type: string }
        email: { type: string }
        full_name: { type: string }
        phone: { type: string }
        reader_card: { type: string }
        state: { type: string, enum: [ACTIVE, DEACTIVATED] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string, description: Returned once. }
        expires_in: { type: integer, description: Access token lifetime, seconds. }
        token_type: { type: string, example: Bearer }
    ReaderInput:
      type: object
      required: [login, password, full_name, email]
      properties:
        login: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }
        reader_card: { type: string }
    LibrarianInput:
      type: object
      required: [login, password, full_name, email]
      properties:
        login: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }
